name: Gemies production voice canary

on:
  workflow_dispatch:
    inputs:
      expected_live_task_definition_arn:
        description: Exact live oxy-alia task-definition ARN reviewed before the run
        required: true
        type: string
      expected_live_image_digest:
        description: Exact sha256 digest running on every live Alia task
        required: true
        type: string
      reason:
        description: Auditable incident or release reason
        required: true
        type: string
      voice:
        description: Product voice the call asks for (female or male)
        required: false
        default: female
        type: choice
        options:
          - female
          - male

permissions:
  id-token: write
  contents: read

concurrency:
  group: alia-production-voice-canary
  cancel-in-progress: false

jobs:
  canary:
    # Main only, and NO `environment:`. A job in an environment presents the
    # OIDC subject `repo:OxyHQ/Gemies:environment:<name>`, which
    # oxy-github-deploy does not trust (it trusts `ref:refs/heads/main`), so the
    # canary died at `Could not assume role with OIDC` on every run. The
    # `production` environment held no rule and no variable; the QA identity is
    # a repository variable, writable by repository admins only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: us-west-2
      CLUSTER: oxy-cluster
      SERVICE: alia
      QA_USER_ID: ${{ vars.ALIA_CANARY_OXY_USER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install the QA sign-in
        run: |
          set -euo pipefail
          core=$(jq -r '.overrides["@oxy.so/core"]' package.json)
          protocol=$(jq -r '.overrides["@oxy.so/protocol"]' package.json)
          [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$protocol" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::the Oxy SDK pins are not exact'; exit 1; }
          mkdir -p "$RUNNER_TEMP/qa-session"
          cp scripts/canary-qa-session.mjs "$RUNNER_TEMP/qa-session/"
          cd "$RUNNER_TEMP/qa-session"
          echo '{"private":true,"type":"module"}' > package.json
          bun add --exact --ignore-scripts "@oxy.so/core@$core" "@oxy.so/protocol@$protocol"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Run the bounded private one-shot
        env:
          EXPECTED_TASK_DEFINITION: ${{ inputs.expected_live_task_definition_arn }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_live_image_digest }}
          REASON: ${{ inputs.reason }}
          VOICE: ${{ inputs.voice }}
          QA_KEY: ${{ secrets.ALIA_CANARY_OXY_QA_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TASK_DEFINITION" =~ ^arn:aws:ecs:us-west-2:237343248947:task-definition/oxy-alia:[1-9][0-9]*$ ]] || {
            echo '::error::expected_live_task_definition_arn is not one exact production Alia revision'; exit 1;
          }
          [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::expected_live_image_digest is invalid'; exit 1; }
          [[ "$QA_USER_ID" =~ ^([a-f0-9]{24}|[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$ ]] || {
            echo '::error::the protected production ALIA_CANARY_OXY_USER_ID is absent or invalid'; exit 1;
          }
          [ -n "$REASON" ] || { echo '::error::reason is required'; exit 1; }
          [[ "$VOICE" == female || "$VOICE" == male ]] || { echo '::error::voice must be female or male'; exit 1; }
          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0]' --output json)
          live=$(jq -r '.taskDefinition' <<<"$service_json")
          [ "$live" = "$EXPECTED_TASK_DEFINITION" ] || { echo "::error::live task definition changed to $live"; exit 1; }
          [ "$(jq -r '.runningCount == .desiredCount and .desiredCount > 0 and .pendingCount == 0 and ([.deployments[] | select(.status == "PRIMARY" and .rolloutState == "COMPLETED")] | length == 1)' <<<"$service_json")" = true ] || {
            echo '::error::Alia is not in a positive completed steady state'; exit 1;
          }
          task_json=$(aws ecs describe-task-definition --task-definition "$live" --query 'taskDefinition' --output json)
          [ "$(jq '[.containerDefinitions[] | select(.name == "alia")] | length' <<<"$task_json")" = 1 ] || { echo '::error::task definition lacks exactly one alia container'; exit 1; }
          container=alia
          declared_image=$(jq -r '.containerDefinitions[] | select(.name == "alia") | .image' <<<"$task_json")
          [[ "$declared_image" == *@"$EXPECTED_IMAGE_DIGEST" ]] || { echo '::error::task definition does not pin the reviewed digest'; exit 1; }
          log_group=$(jq -r '.containerDefinitions[] | select(.name == "alia") | .logConfiguration.options["awslogs-group"]' <<<"$task_json")
          log_prefix=$(jq -r '.containerDefinitions[] | select(.name == "alia") | .logConfiguration.options["awslogs-stream-prefix"]' <<<"$task_json")
          mapfile -t running_tasks < <(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status RUNNING --query 'taskArns[]' --output text | tr '\t' '\n')
          [ "${#running_tasks[@]}" -gt 0 ] || { echo '::error::no running Alia tasks'; exit 1; }
          running_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "${running_tasks[@]}" --output json)
          [ "$(jq --arg td "$live" --arg digest "$EXPECTED_IMAGE_DIGEST" '[.tasks[] | select(.taskDefinitionArn != $td or ([.containers[] | select(.name == "alia" and .imageDigest == $digest)] | length != 1))] | length' <<<"$running_json")" = 0 ] || { echo '::error::running tasks do not all attest the exact revision and digest'; exit 1; }
          network=$(jq -c '.networkConfiguration.awsvpcConfiguration' <<<"$service_json")
          # `bun`: the runtime packages/api/Dockerfile ships since the Node-to-Bun
          # switch. This runs the LIVE image, so it needs a Bun image to be serving:
          # against a pre-switch Node revision the task fails to start (loudly, no
          # write), which is only possible until the first Bun deploy completes.
          task=''
          session_id=''
          session_token=''
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [ -n "$session_id" ]; then
              if ! (cd "$RUNNER_TEMP/qa-session" && ALIA_CANARY_SESSION_ID="$session_id" ALIA_CANARY_SESSION_TOKEN="$session_token" bun canary-qa-session.mjs close); then
                echo '::error::failed to close the QA session'
                status=1
              fi
            fi
            if [ -n "$task" ]; then
              cleanup_failed=0
              if ! aws ecs stop-task --cluster "$CLUSTER" --task "$task" --reason "Gemies voice canary workflow cleanup ${GITHUB_RUN_ID}" >/dev/null; then
                echo '::error::failed to stop the ephemeral Alia canary task'
                cleanup_failed=1
              elif ! aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"; then
                echo '::error::timed out waiting for the ephemeral Alia canary task to stop'
                cleanup_failed=1
              fi
              [ "$cleanup_failed" = 0 ] || exit 1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # The QA person the call is: a session signed in for this run alone, closed when it ends.
          session=$(cd "$RUNNER_TEMP/qa-session" && ALIA_CANARY_OXY_QA_KEY="$QA_KEY" ALIA_CANARY_OXY_USER_ID="$QA_USER_ID" bun canary-qa-session.mjs open) || { echo '::error::the QA account could not sign in'; exit 1; }
          session_token=$(jq -r '.accessToken // empty' <<<"$session")
          session_id=$(jq -r '.sessionId // empty' <<<"$session")
          device_id=$(jq -r '.deviceId // empty' <<<"$session")
          device_secret=$(jq -r '.deviceSecret // empty' <<<"$session")
          unset session
          [ -n "$session_token" ] && [ -n "$session_id" ] && [ -n "$device_id" ] && [ -n "$device_secret" ] || { echo '::error::the QA sign-in returned no session'; exit 1; }
          echo "::add-mask::$session_token"
          echo "::add-mask::$device_secret"
          overrides=$(jq -cn --arg container "$container" --arg user "$QA_USER_ID" --arg voice "$VOICE" --arg session "$session_token" --arg device "$device_id" --arg secret "$device_secret" '{containerOverrides:[{name:$container,command:["bun","packages/api/dist/scripts/voice-call-canary.js","--voice",$voice],environment:[{name:"ALIA_CANARY_OXY_USER_ID",value:$user},{name:"ALIA_CANARY_SESSION_TOKEN",value:$session},{name:"ALIA_CANARY_DEVICE_ID",value:$device},{name:"ALIA_CANARY_DEVICE_SECRET",value:$secret},{name:"ALIA_VOICE_CANARY_CONFIRM",value:"production-voice-canary"}]}]}')
          # Where the alia service runs: its capacity provider strategy when it
          # has one (oxy-cluster's EC2 capacity, EC2-only revisions), otherwise
          # its launch type.
          strategy=$(jq -c '.capacityProviderStrategy // []' <<<"$service_json")
          if [ "$strategy" != "[]" ]; then
            placement=(--capacity-provider-strategy "$strategy")
          else
            placement=(--launch-type "$(jq -r '.launchType // "FARGATE"' <<<"$service_json")")
          fi
          run=$(aws ecs run-task --cluster "$CLUSTER" "${placement[@]}" --task-definition "$live" --network-configuration "$(jq -cn --argjson n "$network" '{awsvpcConfiguration:$n}')" --overrides "$overrides" --started-by "gh-alia-voice-canary-${GITHUB_RUN_ID}" --tags "key=OxyOperation,value=AliaProductionVoiceCanary" "key=OxyTaskFamily,value=oxy-alia" "key=OxyRunId,value=${GITHUB_RUN_ID}" --output json)
          task=$(jq -r '.tasks[0].taskArn // empty' <<<"$run")
          [ -n "$task" ] && [ "$(jq '.failures | length' <<<"$run")" = 0 ] || { echo '::error::ECS refused the canary task'; exit 1; }
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          stopped=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0]' --output json)
          [ "$(jq --arg td "$live" --arg digest "$EXPECTED_IMAGE_DIGEST" '.taskDefinitionArn == $td and ([.containers[] | select(.name == "alia" and .imageDigest == $digest)] | length == 1)' <<<"$stopped")" = true ] || { echo '::error::canary task did not execute the attested Alia image'; exit 1; }
          exit_code=$(jq -r '.containers[] | select(.name == "alia") | .exitCode // -1' <<<"$stopped")
          stream="$log_prefix/$container/${task##*/}"
          result=''
          for attempt in $(seq 1 12); do
            result=$(aws logs filter-log-events --log-group-name "$log_group" --log-stream-names "$stream" --filter-pattern 'ALIA_VOICE_CANARY' --query 'events[].message' --output text 2>/dev/null || true)
            [ -n "$result" ] && break
            sleep 5
          done
          [ "$exit_code" = 0 ] && [ "$(grep -c '^ALIA_VOICE_CANARY {' <<<"$result")" = 1 ] || { echo "::error::voice canary failed (exit=$exit_code)"; grep '^ALIA_VOICE_CANARY ' <<<"$result" | jq -Rr 'sub("^ALIA_VOICE_CANARY ";"")' || true; exit 1; }
          safe=${result#ALIA_VOICE_CANARY }
          jq -e '.schemaVersion == 2 and .passed == true and (.failures | length == 0) and (.errors | length == 0) and (.callId | type == "string") and (.model | type == "string") and .answeredTurns == 1 and ([.tools[] | select(.name == "createAutomation" and .ok)] | length >= 1) and .answerAudioBytes > 0 and .closedReason == "hangup" and .reminderStopped' <<<"$safe" >/dev/null || { echo '::error::the canary report did not pass'; jq '{passed,failures,callId,model,answeredTurns,tools,audioBytes,answerAudioBytes,closedReason,errors,reminderStopped,conversationRemoved}' <<<"$safe"; exit 1; }
          jq '{schemaVersion,passed,callId,model,audioMs,answeredTurns,tools,audioBytes,answerAudioBytes,firstAnswerAudioMs,closedReason,reminderStopped,conversationRemoved,wallMs}' <<<"$safe"
          # Kaana's request id of the call, as the API logged it beside the call id (ADR 0041 §7).
          call_id=$(jq -r '.callId' <<<"$safe")
          aws logs filter-log-events --log-group-name "$log_group" --log-stream-names "$stream" --filter-pattern "\"$call_id\"" --query 'events[].message' --output text 2>/dev/null | grep -o '"kaanaRequestId":"[^"]*"' | sort -u || echo '::warning::no Kaana request id was logged for the call'
          task=''
          trap - EXIT INT TERM
