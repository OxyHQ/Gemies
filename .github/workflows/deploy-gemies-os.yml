# Deploy GemiesOS: two images, one instance.
#
#  - `oxy/gemies-os`            the control API (`--target host`)
#  - `oxy/gemies-os-workspace`  the image every actor's computer runs and, with
#                               another entrypoint, the gemies' browser and its
#                               egress proxy (`--target workspace`)
#
# Both are targets of one Dockerfile (packages/gemies-os/Dockerfile), built
# from the repository root.
#
# Not ECS: GemiesOS is one EC2 instance (oxy-infra `terraform-uswest2/
# gemies-os.tf`) because Fargate cannot run Docker or gVisor. A release is
# therefore: push both images, record their linux/arm64 DIGESTS in SSM, and ask
# the instance — by SSM Run Command, no SSH — to restart its systemd unit, whose
# ExecStartPre pulls exactly those digests. The host refuses to attach to any
# container whose image is not the configured digest, so a new workspace image
# reaches each actor at their next start. An instance that is asleep is not
# woken: it picks the recorded digests up on its next start.
#
# Released on demand from main (`workflow_dispatch`): the OIDC role trusts only
# main, and a restart is a deliberate act on a host that may be running
# someone's computer.
name: Deploy GemiesOS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Its own group: an instance restart must never interleave with another
  # (two restarts racing can leave the unit on the OLDER digest pair).
  group: deploy-gemies-os
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  HOST_REPOSITORY: oxy/gemies-os
  WORKSPACE_REPOSITORY: oxy/gemies-os-workspace
  SSM_PREFIX: /oxy/gemies-os

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # A backstop against GitHub's 6-hour default, deliberately loose: two cold
    # ARM64 image builds (the workspace one carries a browser) plus the bounded
    # health poll below (60 x 5s).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push both images (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          build() {
            local repository="$1" target="$2"
            local img="$ECR_REGISTRY/$repository"
            docker buildx build \
              --platform linux/arm64 \
              -f packages/gemies-os/Dockerfile \
              --target "$target" \
              -t "$img:$COMMIT_TAG" \
              --metadata-file "$RUNNER_TEMP/$target.json" \
              --push \
              .
            local index
            index=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/$target.json")
            if [[ ! "$index" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::buildx produced no usable image index digest for $repository"
              exit 1
            fi
            local runtime
            runtime="$(IMAGE_REPOSITORY="$img" INDEX_DIGEST="$index" bash .github/scripts/resolve-ecr-platform-digest.sh)"
            echo "$target=$img@$runtime" >>"$GITHUB_OUTPUT"
            echo "Built $repository -> $img@$runtime"
          }
          build "$HOST_REPOSITORY" host
          build "$WORKSPACE_REPOSITORY" workspace

      - name: Record the digests the instance will run
        env:
          HOST_IMAGE: ${{ steps.build.outputs.host }}
          WORKSPACE_IMAGE: ${{ steps.build.outputs.workspace }}
        run: |
          set -euo pipefail
          aws ssm put-parameter --overwrite --type String --name "$SSM_PREFIX/HOST_IMAGE" --value "$HOST_IMAGE"
          aws ssm put-parameter --overwrite --type String --name "$SSM_PREFIX/WORKSPACE_IMAGE" --value "$WORKSPACE_IMAGE"

      - name: Restart the host on the new digests
        run: |
          set -euo pipefail
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=gemies-os" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$INSTANCE" ]; then
            echo "::warning::no running gemies-os instance; images are in ECR and SSM, nothing restarted"
            exit 0
          fi
          COMMAND=$(aws ssm send-command \
            --instance-ids $INSTANCE \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --parameters 'commands=["systemctl restart gemies-os","ADDR=$(hostname -I | cut -d\" \" -f1)","for i in $(seq 1 36); do curl -fsS \"http://$ADDR:8080/health\" && exit 0; sleep 5; done; echo host never became healthy; exit 1"]' \
            --query 'Command.CommandId' --output text)
          # A green job is not a deploy: wait for the unit to come back healthy.
          # Polled rather than `aws ssm wait command-executed`, whose fixed
          # ~100 s budget is shorter than a restart that pulls both images and
          # then waits up to 3 minutes for /health on the instance's own address
          # (the API listens on the private IP and loopback 8081 only).
          for id in $INSTANCE; do
            for _ in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND" --instance-id "$id" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 5
            done
            if [ "$STATUS" != Success ]; then
              aws ssm get-command-invocation --command-id "$COMMAND" --instance-id "$id" \
                --query '[StandardOutputContent,StandardErrorContent]' --output text || true
              echo "::error::host $id did not come back healthy ($STATUS)"
              exit 1
            fi
          done
          echo "Host restarted on the recorded digests."
